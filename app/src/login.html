<!doctype html>
<html lang="en">
<head>
<title>Sign in · Triage</title>
<meta name="description" content="Sign in to Triage, the credit pre-screener that takes clear-cut personal-loan declines out of manual review.">
<!--#head-->
</head>
<body>
<a class="skip" href="#main">Skip to the form</a>
<div class="auth-shell">
<header>
  <div class="wrap bar">
    <a class="brand" href="/">
      <div class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M2 3h14M4.5 9h9M7 15h4" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></div>
      <div><b>Triage</b><small>Personal-loan pre-screening</small></div>
    </a>
    <div class="hdr-actions"><button class="icon-btn" type="button" data-theme-toggle aria-label="Theme"></button></div>
  </div>
</header>

<main class="wrap auth-main" id="main" tabindex="-1">
  <div class="auth-card">
    <div class="auth-switch" role="tablist" aria-label="Account" id="switch">
      <button type="button" role="tab" id="tab-signin" aria-selected="true" aria-controls="authForm">Sign in</button>
      <button type="button" role="tab" id="tab-signup" aria-selected="false" aria-controls="authForm">Create account</button>
    </div>
    <h1 id="title">Welcome back</h1>
    <p class="sub" id="subtitle">Sign in to score applications, keep your policy and see your history.</p>

    <div class="alert" id="alert" role="alert" hidden></div>

    <form id="authForm" novalidate>
      <div class="f" id="f-name" hidden>
        <label for="name">Your name <span class="hint">(optional)</span></label>
        <input id="name" name="name" autocomplete="name" maxlength="120">
      </div>
      <div class="f" id="f-email">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="email-err">
        <span class="ferr" id="email-err"></span>
      </div>
      <div class="f" id="f-password">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
          <label for="password" id="password-label">Password</label>
          <button type="button" class="linkbtn" id="forgotLink" style="font-size:12.5px">Forgot password?</button>
        </div>
        <div class="pw">
          <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-hint password-err">
          <button type="button" id="pwToggle" aria-controls="password" aria-pressed="false">Show</button>
        </div>
        <span class="hint" id="password-hint" hidden>At least 8 characters.</span>
        <span class="ferr" id="password-err"></span>
      </div>
      <button class="btn primary lg block" type="submit" id="submit">Sign in</button>
    </form>

    <div id="googleBlock">
      <div class="or">or</div>
      <button class="btn lg block gbtn" type="button" id="google"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>Continue with Google</button>
    </div>

    <p class="auth-foot" id="foot"></p>
  </div>
</main>

<footer><div class="wrap">Triage · Calibo AI Academy MUC02 · Batch 10 · <a href="/">About Triage</a></div></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="/config.js"></script>
<script src="/js/supa.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
